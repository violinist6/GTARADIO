<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA V Radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="wheel" aria-label="Radio stations">
    <div id="center">
      <div id="st-name">Radio off</div>
      <div id="np-title"></div>
      <div id="np-artist"></div>
      <div id="np-tag"></div>
    </div>
  </div>
  <div id="controls">
    <label class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <label class="toggle"><input id="news" type="checkbox"> News bulletins</label>
  </div>
  <div id="phone"><button id="phone-btn">Make iPhone copy</button> <span id="phone-msg"></span></div>
  <p id="hint">← / → or Q / E to change station · Space to turn the radio off</p>
</main>
<div id="start"><button id="start-btn">Turn on the radio</button></div>
<script src="app.js"></script>
</body>
</html>
